<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Canvas Dino Runner</title>
<style>
    :root {
        --bg: #f7f7f7;
        --ink: #535353;
        --ground: #777;
    }

    * { box-sizing: border-box; }

    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        font-family: Arial, Helvetica, sans-serif;
        color: var(--ink);
    }

    body {
        display: grid;
        place-items: center;
        touch-action: manipulation;
        user-select: none;
    }

    #gameWrap {
        width: min(100vw, 1000px);
        padding: 12px;
    }

    canvas {
        display: block;
        width: 100%;
        height: auto;
        background: var(--bg);
        border: 1px solid #ddd;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        touch-action: manipulation;
    }

    .hint {
        text-align: center;
        margin-top: 8px;
        font-size: 12px;
        color: #888;
    }

    @media (max-width: 600px) {
        #gameWrap { padding: 6px; }
        .hint { font-size: 11px; }
    }
</style>
</head>
<body>
<div id="gameWrap">
    <canvas id="game" width="1000" height="300" aria-label="Dino runner game"></canvas>
    <div class="hint">Space / ↑ / Tap to jump</div>
</div>

<script>
"use strict";

/* =========================================================
   Canvas Dino Runner
   Everything is contained in this one HTML file.
   ========================================================= */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

// -------------------------
// Game constants
// -------------------------
const WIDTH = canvas.width;
const HEIGHT = canvas.height;
const GROUND_Y = 245;

const PHYSICS = {
    gravity: 2300,
    jumpVelocity: -820,
    maxFallSpeed: 1250
};

const SPEED = {
    initial: 360,
    max: 900,
    acceleration: 10
};

const COLORS = {
    background: "#f7f7f7",
    foreground: "#535353",
    muted: "#8a8a8a",
    ground: "#777",
    cloud: "#d9d9d9"
};

// -------------------------
// Persistent high score
// -------------------------
const HIGH_SCORE_KEY = "canvasDinoHighScore";

function loadHighScore() {
    const value = Number(localStorage.getItem(HIGH_SCORE_KEY));
    return Number.isFinite(value) ? Math.max(0, Math.floor(value)) : 0;
}

function saveHighScore(score) {
    try {
        localStorage.setItem(HIGH_SCORE_KEY, String(score));
    } catch (_) {
        // Storage can be unavailable in privacy-restricted environments.
    }
}

// -------------------------
// Game state
// -------------------------
const STATE = {
    READY: "ready",
    PLAYING: "playing",
    GAME_OVER: "gameover"
};

let gameState = STATE.READY;
let lastTime = 0;
let elapsed = 0;
let distance = 0;
let score = 0;
let highScore = loadHighScore();
let speed = SPEED.initial;
let groundOffset = 0;
let nextSpawnDistance = 500;
let obstacles = [];
let clouds = [];

// -------------------------
// Simple audio using Web Audio API
// -------------------------
let audioContext = null;

function initAudio() {
    if (!audioContext) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) audioContext = new AudioCtx();
    }

    if (audioContext && audioContext.state === "suspended") {
        audioContext.resume().catch(() => {});
    }
}

function beep(frequency, duration, type = "square", volume = 0.035, slideTo = null) {
    if (!audioContext) return;

    const now = audioContext.currentTime;
    const oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();

    oscillator.type = type;
    oscillator.frequency.setValueAtTime(frequency, now);

    if (slideTo !== null) {
        oscillator.frequency.exponentialRampToValueAtTime(
            Math.max(30, slideTo),
            now + duration
        );
    }

    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(volume, now + 0.008);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    oscillator.start(now);
    oscillator.stop(now + duration + 0.01);
}

function playJumpSound() {
    beep(520, 0.09, "square", 0.025, 760);
}

function playScoreSound() {
    beep(760, 0.06, "square", 0.018, 980);
}

function playGameOverSound() {
    beep(240, 0.16, "sawtooth", 0.035, 95);
}

// -------------------------
// Dinosaur
// -------------------------
const dino = {
    x: 90,
    y: GROUND_Y - 54,
    width: 44,
    height: 54,
    velocityY: 0,
    grounded: true,
    runTime: 0,

    reset() {
        this.x = 90;
        this.y = GROUND_Y - this.height;
        this.velocityY = 0;
        this.grounded = true;
        this.runTime = 0;
    },

    jump() {
        if (gameState !== STATE.PLAYING || !this.grounded) return;

        this.velocityY = PHYSICS.jumpVelocity;
        this.grounded = false;
        playJumpSound();
    },

    update(dt) {
        if (gameState !== STATE.PLAYING) return;

        this.velocityY += PHYSICS.gravity * dt;
        this.velocityY = Math.min(this.velocityY, PHYSICS.maxFallSpeed);
        this.y += this.velocityY * dt;
        this.runTime += dt;

        const floor = GROUND_Y - this.height;

        if (this.y >= floor) {
            this.y = floor;
            this.velocityY = 0;
            this.grounded = true;
        }
    },

    draw() {
        const x = Math.round(this.x);
        const y = Math.round(this.y);

        ctx.fillStyle = COLORS.foreground;

        // Body
        ctx.fillRect(x + 9, y + 18, 27, 25);

        // Neck + head
        ctx.fillRect(x + 27, y + 5, 12, 24);
        ctx.fillRect(x + 34, y, 20, 20);
        ctx.fillRect(x + 48, y + 7, 9, 9);

        // Tail
        ctx.fillRect(x, y + 25, 14, 8);
        ctx.fillRect(x - 7, y + 31, 13, 6);

        // Arms
        ctx.fillRect(x + 31, y + 25, 12, 5);
        ctx.fillRect(x + 40, y + 29, 5, 9);

        // Legs — alternate when running
        const runningFrame = Math.floor(this.runTime * 12) % 2;
        if (this.grounded && runningFrame === 0) {
            ctx.fillRect(x + 13, y + 40, 7, 14);
            ctx.fillRect(x + 30, y + 40, 7, 10);
            ctx.fillRect(x + 27, y + 50, 13, 4);
            ctx.fillRect(x + 10, y + 50, 13, 4);
        } else {
            ctx.fillRect(x + 13, y + 40, 7, 10);
            ctx.fillRect(x + 30, y + 40, 7, 14);
            ctx.fillRect(x + 27, y + 50, 13, 4);
            ctx.fillRect(x + 10, y + 46, 13, 4);
        }

        // Eye
        ctx.fillStyle = COLORS.background;
        ctx.fillRect(x + 47, y + 5, 3, 3);
    }
};

// -------------------------
// Obstacles
// -------------------------
function createObstacle(x) {
    // Multiple cactus shapes give the obstacle field some variety.
    const variant = Math.random() < 0.55 ? 0 : 1;
    const scale = variant === 0 ? 1 : 1.15;

    const width = variant === 0 ? 20 : 34;
    const height = variant === 0 ? 42 : 54;

    return {
        x,
        y: GROUND_Y - height,
        width: width * scale,
        height: height * scale,
        variant,
        scored: false
    };
}

function spawnObstacle() {
    obstacles.push(createObstacle(WIDTH + 30));

    // Spacing shrinks somewhat as the game becomes faster,
    // but remains random to avoid predictable patterns.
    const minGap = Math.max(260, 430 - (speed - SPEED.initial) * 0.35);
    const maxGap = Math.max(minGap + 100, 720 - (speed - SPEED.initial) * 0.25);
    nextSpawnDistance = minGap + Math.random() * (maxGap - minGap);
}

function updateObstacles(dt) {
    if (gameState !== STATE.PLAYING) return;

    for (const obstacle of obstacles) {
        obstacle.x -= speed * dt;

        if (!obstacle.scored && obstacle.x + obstacle.width < dino.x) {
            obstacle.scored = true;
            playScoreSound();
        }
    }

    obstacles = obstacles.filter(o => o.x + o.width > -50);

    nextSpawnDistance -= speed * dt;

    if (nextSpawnDistance <= 0) {
        spawnObstacle();
    }
}

function drawObstacle(o) {
    const x = Math.round(o.x);
    const y = Math.round(o.y);
    const w = Math.round(o.width);
    const h = Math.round(o.height);

    ctx.fillStyle = COLORS.foreground;

    // Main trunk
    ctx.fillRect(x + Math.floor(w * 0.3), y, Math.floor(w * 0.4), h);

    // Branches
    if (o.variant === 0) {
        ctx.fillRect(x, y + 16, Math.floor(w * 0.4), 7);
        ctx.fillRect(x, y + 10, 7, 18);
        ctx.fillRect(x + Math.floor(w * 0.6), y + 25, Math.floor(w * 0.4), 7);
        ctx.fillRect(x + w - 7, y + 18, 7, 18);
    } else {
        ctx.fillRect(x, y + 21, Math.floor(w * 0.38), 8);
        ctx.fillRect(x + 2, y + 10, 8, 25);
        ctx.fillRect(x + Math.floor(w * 0.62), y + 30, Math.floor(w * 0.38), 8);
        ctx.fillRect(x + w - 10, y + 23, 10, 25);
    }
}

// -------------------------
// Clouds / background
// -------------------------
function createCloud(x = WIDTH + Math.random() * 300) {
    clouds.push({
        x,
        y: 35 + Math.random() * 65,
        width: 42 + Math.random() * 45,
        speed: 25 + Math.random() * 18
    });
}

function updateClouds(dt) {
    for (const cloud of clouds) {
        cloud.x -= cloud.speed * dt;
    }

    clouds = clouds.filter(c => c.x + c.width > -30);

    if (clouds.length < 5 && Math.random() < dt * 0.7) {
        createCloud();
    }
}

function drawCloud(c) {
    ctx.fillStyle = COLORS.cloud;
    ctx.fillRect(c.x, c.y + 10, c.width, 7);
    ctx.fillRect(c.x + 10, c.y + 4, c.width * 0.35, 12);
    ctx.fillRect(c.x + 27, c.y, c.width * 0.25, 16);
}

// -------------------------
// Collision
// -------------------------
function getDinoHitbox() {
    // Slightly smaller than the sprite for fair gameplay.
    return {
        x: dino.x + 7,
        y: dino.y + 5,
        width: dino.width - 10,
        height: dino.height - 7
    };
}

function getObstacleHitbox(o) {
    return {
        x: o.x + 3,
        y: o.y + 2,
        width: o.width - 6,
        height: o.height - 2
    };
}

function intersects(a, b) {
    return (
        a.x < b.x + b.width &&
        a.x + a.width > b.x &&
        a.y < b.y + b.height &&
        a.y + a.height > b.y
    );
}

function checkCollisions() {
    const dinoBox = getDinoHitbox();

    for (const obstacle of obstacles) {
        if (intersects(dinoBox, getObstacleHitbox(obstacle))) {
            endGame();
            return;
        }
    }
}

// -------------------------
// Game flow
// -------------------------
function resetGame() {
    gameState = STATE.READY;
    elapsed = 0;
    distance = 0;
    score = 0;
    speed = SPEED.initial;
    groundOffset = 0;
    nextSpawnDistance = 500;
    obstacles = [];
    dino.reset();
}

function startGame() {
    initAudio();

    if (gameState === STATE.READY || gameState === STATE.GAME_OVER) {
        gameState = STATE.PLAYING;
        elapsed = 0;
        distance = 0;
        score = 0;
        speed = SPEED.initial;
        groundOffset = 0;
        nextSpawnDistance = 480;
        obstacles = [];
        dino.reset();

        // Spawn first obstacle after a safe starting gap.
        nextSpawnDistance = 550 + Math.random() * 250;
    }
}

function endGame() {
    if (gameState !== STATE.PLAYING) return;

    gameState = STATE.GAME_OVER;
    playGameOverSound();

    if (score > highScore) {
        highScore = score;
        saveHighScore(highScore);
    }
}

function handleJump() {
    initAudio();

    if (gameState === STATE.READY) {
        startGame();
        dino.jump();
        return;
    }

    if (gameState === STATE.GAME_OVER) {
        startGame();
        dino.jump();
        return;
    }

    dino.jump();
}

// -------------------------
// Scoring and difficulty
// -------------------------
function updateScore(dt) {
    distance += speed * dt;
    score = Math.floor(distance / 100);

    if (score > highScore) {
        highScore = score;
        saveHighScore(highScore);
    }
}

function updateDifficulty(dt) {
    speed = Math.min(SPEED.max, speed + SPEED.acceleration * dt);
}

// -------------------------
// Drawing
// -------------------------
function drawGround() {
    ctx.strokeStyle = COLORS.ground;
    ctx.lineWidth = 2;

    ctx.beginPath();
    ctx.moveTo(0, GROUND_Y + 1);
    ctx.lineTo(WIDTH, GROUND_Y + 1);
    ctx.stroke();

    // Scrolling ground texture.
    ctx.fillStyle = COLORS.ground;
    const spacing = 35;
    const offset = Math.floor(groundOffset % spacing);

    for (let x = -spacing + offset; x < WIDTH + spacing; x += spacing) {
        const length = 7 + ((Math.floor((x + 1000) / spacing) * 17) % 15);
        ctx.fillRect(x, GROUND_Y + 8, length, 2);
    }
}

function drawHUD() {
    ctx.fillStyle = COLORS.foreground;
    ctx.font = "bold 16px monospace";
    ctx.textAlign = "right";

    const scoreText = String(score).padStart(5, "0");
    const highText = String(highScore).padStart(5, "0");

    ctx.fillText(`HI ${highText}  ${scoreText}`, WIDTH - 20, 30);
}

function drawCenterText(title, subtitle) {
    ctx.textAlign = "center";

    ctx.fillStyle = COLORS.foreground;
    ctx.font = "bold 28px Arial";
    ctx.fillText(title, WIDTH / 2, 105);

    ctx.font = "16px Arial";
    ctx.fillStyle = COLORS.muted;
    ctx.fillText(subtitle, WIDTH / 2, 135);
}

function draw() {
    ctx.clearRect(0, 0, WIDTH, HEIGHT);
    ctx.fillStyle = COLORS.background;
    ctx.fillRect(0, 0, WIDTH, HEIGHT);

    for (const cloud of clouds) drawCloud(cloud);

    drawGround();

    for (const obstacle of obstacles) drawObstacle(obstacle);

    dino.draw();
    drawHUD();

    if (gameState === STATE.READY) {
        drawCenterText("DINO RUNNER", "Press SPACE / ↑ or tap to start");
    } else if (gameState === STATE.GAME_OVER) {
        drawCenterText("GAME OVER", `Score ${score}  •  Press SPACE / ↑ or tap to restart`);
    }
}

// -------------------------
// Main update loop
// -------------------------
function update(dt) {
    dt = Math.min(dt, 0.033); // Prevent giant physics steps after tab switching.

    updateClouds(dt);

    if (gameState !== STATE.PLAYING) return;

    updateDifficulty(dt);
    updateScore(dt);

    groundOffset += speed * dt;

    dino.update(dt);
    updateObstacles(dt);
    checkCollisions();
}

// -------------------------
// Input
// -------------------------
window.addEventListener("keydown", event => {
    if (event.code === "Space" || event.code === "ArrowUp") {
        event.preventDefault();
        handleJump();
    }
});

canvas.addEventListener("pointerdown", event => {
    event.preventDefault();
    handleJump();
});

// -------------------------
// Start background clouds
// -------------------------
for (let i = 0; i < 4; i++) {
    createCloud(100 + i * 260);
}

// -------------------------
// Animation loop
// -------------------------
function loop(timestamp) {
    if (!lastTime) lastTime = timestamp;

    const dt = (timestamp - lastTime) / 1000;
    lastTime = timestamp;

    update(dt);
    draw();

    requestAnimationFrame(loop);
}

resetGame();
requestAnimationFrame(loop);
</script>
</body>
</html>
